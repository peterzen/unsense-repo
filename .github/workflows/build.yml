name: Build and Push Unsense Theme

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4

      - name: Setup yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Build theme
        working-directory: src/unsense-theme
        run: |
          yarn install --mode=update-lockfile
          yarn build
          yarn build:export
          yarn clean:modules
          
      - name: Package and index in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          copyback: true
          prepare: |
            pkg install -y bash gtar pkg
          run: |
            set -ex
            THEME_DIR=${GITHUB_WORKSPACE}/misc/unsense-theme
            REPO_DIR=${THEME_DIR}/work/pkg
            make package
            ${GITHUB_WORKSPACE}/Scripts/pkg-repo.sh ${REPO_DIR}
            echo '=== repo contents ===' && find ${REPO_DIR} -type f

      - name: Copy package and index to docs
        run: |
          sudo apt-get install -y pandoc
          DEST_DIR=docs/unsense-repo/FreeBSD:14:amd64
          REPO_DIR=${GITHUB_WORKSPACE}/misc/unsense-theme/work/pkg
          mkdir -p ${DEST_DIR}
          mkdir -p ${REPO_DIR}
          cp -v $REPO_DIR/* ${DEST_DIR}/
          cp -rv src/www/assets/* docs/
          cp src/www/assets/unsense.conf docs/unsense-repo/
          pandoc --standalone \
            --css=simple.css \
            src/www/index.md \
            -o docs/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/
          cname: pkg.froggle.org
